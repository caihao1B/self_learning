controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    costmap_update_timeout: 0.5
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 2.0
    odom_topic: /s05/odometry
    enable_stamped_cmd_vel: false
    progress_checker_plugins:
    - progress
    goal_checker_plugins:
    - goal
    - dock_goal
    controller_plugins:
    - RPP
    - DWB
    - DockRPP
    progress:
      plugin: nav2_controller::PoseProgressChecker
      required_movement_radius: 0.05
      required_movement_angle: 0.1
      movement_time_allowance: 20.0
    goal:
      plugin: nav2_controller::PositionGoalChecker
      xy_goal_tolerance: 0.025
      stateful: false
    DWB:
      plugin: dwb_core::DWBLocalPlanner
      debug_trajectory_details: false
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.25
      max_vel_y: 0.0
      max_vel_theta: 0.3
      min_speed_xy: 0.0
      max_speed_xy: 0.25
      min_speed_theta: 0.0
      acc_lim_x: 0.3
      acc_lim_y: 0.0
      acc_lim_theta: 0.4
      decel_lim_x: -0.45
      decel_lim_y: 0.0
      decel_lim_theta: -0.5
      vx_samples: 18
      vy_samples: 1
      vtheta_samples: 24
      sim_time: 2.0
      linear_granularity: 0.025
      angular_granularity: 0.025
      transform_tolerance: 0.15
      xy_goal_tolerance: 0.05
      trans_stopped_velocity: 0.01
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics:
      - RotateToGoal
      - Oscillation
      - ObstacleFootprint
      - GoalAlign
      - PathAlign
      - PathDist
      - GoalDist
      RotateToGoal:
        scale: 20.0
        slowing_factor: 5.0
        lookahead_time: 1.0
      PathAlign:
        scale: 24.0
        forward_point_distance: 0.1
      GoalAlign:
        scale: 16.0
        forward_point_distance: 0.1
      PathDist:
        scale: 24.0
      GoalDist:
        scale: 16.0
      ObstacleFootprint:
        scale: 0.02
    RPP:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.3
      lookahead_dist: 0.45
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.7
      lookahead_time: 3.0
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.15
      min_approach_linear_velocity: 0.03
      approach_velocity_scaling_dist: 0.25
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.9
      regulated_linear_scaling_min_speed: 0.005
      use_rotate_to_heading: true
      allow_reversing: false
      max_angular_accel: 0.4
      max_robot_pose_search_dist: 8.0
      rotate_to_heading_angular_vel: 0.35
      rotate_to_heading_min_angle: 0.45
      stateful: false
    MPPI:
      plugin: s13::MeasuredController
      implementation: nav2_mppi_controller::MPPIController
      time_steps: 100
      model_dt: 0.05
      batch_size: 750
      iteration_count: 1
      vx_std: 0.05
      vy_std: 0.0
      wz_std: 0.025
      vx_max: 0.12
      vx_min: 0.0
      vy_max: 0.0
      wz_max: 0.1
      ax_max: 0.5
      ax_min: -0.8
      ay_max: 0.0
      az_max: 0.8
      prune_distance: 3.0
      transform_tolerance: 0.15
      temperature: 0.3
      gamma: 1.0e-05
      motion_model: DiffDrive
      visualize: false
      regenerate_noises: true
      reset_period: 1.0
      retry_attempt_limit: 1
      AckermannConstraints:
        min_turning_r: 2.11
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PreferForwardCritic
      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        consider_footprint: true
        critical_cost: 253.0
        collision_cost: 1000000.0
        near_goal_distance: 0.3
        trajectory_point_step: 2
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 12.0
        threshold_to_consider: 0.6
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 8.0
        threshold_to_consider: 0.4
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 80.0
        max_path_occupancy_ratio: 0.05
        trajectory_point_step: 3
        threshold_to_consider: 0.15
        offset_from_furthest: 1
        use_path_orientations: true
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 80.0
        offset_from_furthest: 6
        threshold_to_consider: 0.15
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
        offset_from_furthest: 2
        threshold_to_consider: 0.15
        max_angle_to_furthest: 0.12
        mode: 0
      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.2
    dock_goal:
      plugin: nav2_controller::PositionGoalChecker
      xy_goal_tolerance: 0.008
      stateful: false
    DockRPP:
      plugin: nav2_regulated_pure_pursuit_controller::RegulatedPurePursuitController
      desired_linear_vel: 0.06
      lookahead_dist: 0.05
      min_lookahead_dist: 0.25
      max_lookahead_dist: 0.7
      lookahead_time: 3.0
      use_velocity_scaled_lookahead_dist: false
      transform_tolerance: 0.15
      min_approach_linear_velocity: 0.01
      approach_velocity_scaling_dist: 0.08
      use_collision_detection: true
      max_allowed_time_to_collision_up_to_carrot: 2.0
      use_regulated_linear_velocity_scaling: true
      use_cost_regulated_linear_velocity_scaling: false
      regulated_linear_scaling_min_radius: 0.2
      regulated_linear_scaling_min_speed: 0.003
      use_rotate_to_heading: true
      allow_reversing: false
      max_angular_accel: 0.4
      max_robot_pose_search_dist: 0.25
      rotate_to_heading_angular_vel: 0.35
      rotate_to_heading_min_angle: 0.45
      stateful: false
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins:
    - GridBased
    GridBased:
      plugin: r07::ExactGoalPlanner
      tolerance: 0.04
      downsample_costmap: false
      allow_unknown: false
      max_iterations: 1000000
      max_on_approach_iterations: 1000
      max_planning_time: 2.0
      cost_travel_multiplier: 2.0
      use_final_approach_orientation: false
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /s05/odometry
    bt_loop_duration: 20
    default_server_timeout: 1000
    wait_for_service_timeout: 2000
    default_nav_to_pose_bt_xml: /home/ceihao/robot_project/optimization_v2/three_tasks/editions/R07/navigate.xml
    navigators:
    - navigate_to_pose
    navigate_to_pose:
      plugin: nav2_bt_navigator::NavigateToPoseNavigator
    transform_tolerance: 0.15
    filter_duration: 0.3
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: true
      width: 12
      height: 12
      resolution: 0.15
      track_unknown_space: false
      always_send_full_costmap: true
      footprint: '[[-0.495, -0.335], [0.495, -0.335], [0.495, 0.335], [-0.495, 0.335]]'
      plugins:
      - observed
      - inflation
      observed:
        plugin: s09::ObservedRiskLayer
        topic: /r07/risk_local
        max_age: 0.6
      inflation:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.75
        cost_scaling_factor: 4.0
      footprint_padding: 0.1
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 5.0
      publish_frequency: 2.0
      rolling_window: false
      width: 142
      height: 61
      resolution: 0.15
      track_unknown_space: true
      always_send_full_costmap: true
      footprint: '[[-0.495, -0.335], [0.495, -0.335], [0.495, 0.335], [-0.495, 0.335]]'
      plugins:
      - static
      - live_obstacles
      - inflation
      inflation:
        plugin: nav2_costmap_2d::InflationLayer
        inflation_radius: 0.75
        cost_scaling_factor: 4.0
      footprint_padding: 0.1
      origin_x: -19.0
      origin_y: 6.0
      static:
        plugin: nav2_costmap_2d::StaticLayer
        map_subscribe_transient_local: true
        map_topic: /map
      live_obstacles:
        plugin: r08::ObservedPriorLayer
        topic: /r07/risk_local
        max_age: 0.6
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: /home/ceihao/robot_project/optimization_v2/three_tasks/editions/R07/prior.yaml
lifecycle_manager:
  ros__parameters:
    use_sim_time: true
    autostart: false
    bond_timeout: 5.0
    node_names:
    - map_server
    - controller_server
    - planner_server
    - bt_navigator
